name: Lune parts 2-4 checks

on:
  push:
    branches:
      - build/lune-parts-2-4-polish
      - build/part2-database-identity
      - build/part3-discovery-experience
      - build/part4-taste-engine
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check server.js
      - run: node --check lune-data.js
      - run: node --check account.js
      - run: node --check discovery-experience.js
      - run: node --check taste-engine-v5.js
      - run: node --check experience-v4.js
      - run: node --check site-motion.js
      - run: node discovery-experience.test.js
      - run: node taste-engine-v5.test.js
      - run: node scripts/qa-public-experience.js
