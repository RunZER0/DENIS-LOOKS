name: Lune Part 2 checks

on:
  push:
    branches:
      - build/part2-database-identity
  pull_request:
    branches:
      - build/part3-discovery-experience

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node --check server.js
      - run: node --check lune-data.js
      - run: node --check account.js
      - run: node --check discovery-experience.js
      - run: node --check taste-engine-v5.js
      - run: node discovery-experience.test.js
      - run: node taste-engine-v5.test.js
